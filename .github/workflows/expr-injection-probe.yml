name: expr-injection-probe
# 授权渗透测试专用：在自有仓库内验证 Actions 表达式注入面
# 目的：判定 GitHub 是否对 `run:` 内插值的不可信输入（issue/branch 名）做防护
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'probe label'
        default: 'baseline'
  issues:
    types: [opened]

jobs:
  unsafe-interpolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Baseline environment probe
        run: |
          echo "=== BASELINE START ==="
          id
          echo "user=$(whoami) uid=$(id -u)"
          echo "hostname=$(hostname)"
          echo "workspace=${GITHUB_WORKSPACE}"
          echo "runner_os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          echo "=== BASELINE END ==="

      - name: Unsafe title interpolation (intentional weakness for testing)
        if: github.event_name == 'issues'
        run: |
          echo "=== TITLE INTERPOLATION TEST ==="
          echo "title: ${{ github.event.issue.title }}"
          echo "=== END ==="

      - name: Unsafe input interpolation
        run: |
          echo "=== INPUT TEST ==="
          echo "probe: ${{ github.event.inputs.probe }}"
          echo "ref: ${{ github.ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "=== END ==="
