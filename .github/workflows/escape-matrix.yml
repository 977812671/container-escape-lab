name: container-escape-matrix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  escape-probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        variant: [privileged, sock, plain]
    steps:
      - uses: actions/checkout@v4

      - name: Host baseline
        run: bash scripts/host-baseline.sh

      - name: Run escape probes (variant=${{ matrix.variant }})
        run: bash scripts/run-variant.sh ${{ matrix.variant }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: escape-report-${{ matrix.os }}-${{ matrix.variant }}
          path: reports/
          if-no-files-found: error
